name: wms-local
services:
  admin-web:
    build:
      context: ..
      dockerfile: admin-web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3100}/api/v1
    ports: ['${ADMIN_WEB_PORT:-3200}:3000']
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://wms:wms@postgres:5432/wms
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:${MINIO_PORT:-59000}
      S3_REGION: us-east-1
      S3_BUCKET: wms-attachments
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: change-me
      JWT_ACCESS_SECRET: local-compose-access-secret-change-me
      JWT_REFRESH_SECRET: local-compose-refresh-secret-change-me
      DEMO_ADMIN_PASSWORD: Demo-Wms-Change-Me-2026!
      CORS_ORIGINS: http://localhost:${ADMIN_WEB_PORT:-3200}
    command:
      [
        '/bin/sh',
        '-c',
        'node backend/dist/database/migrate.js && node backend/dist/database/seed.js && node backend/dist/main.js',
      ]
    ports: ['${API_PORT:-3100}:3000']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wms
      POSTGRES_USER: wms
      POSTGRES_PASSWORD: wms
    ports: ['${POSTGRES_PORT:-55432}:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wms -d wms']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8-alpine
    ports: ['${REDIS_PORT:-56379}:6379']
    command: ['redis-server', '--appendonly', 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: change-me
    ports: ['${MINIO_PORT:-59000}:9000', '${MINIO_CONSOLE_PORT:-59001}:9001']
    volumes: [minio-data:/data]
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  redis-data:
  minio-data:
