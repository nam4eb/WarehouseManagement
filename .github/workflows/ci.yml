name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wms_test
          POSTGRES_USER: wms
          POSTGRES_PASSWORD: wms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wms -d wms_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://wms:wms@localhost:5432/wms_test
      TEST_DATABASE_URL: postgresql://wms:wms@localhost:5432/wms_test
      JWT_ACCESS_SECRET: ci-only-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run migrate -w backend
      - run: npm test
      - run: npm run projection:verify -w backend
      - run: npm run build
